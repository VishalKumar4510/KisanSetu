services:
  postgres:
    image: postgres:16-alpine
    container_name: kisansetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kisansetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kisansetu"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kisansetu-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kisansetu?schema=public
      JWT_SECRET: kisansetu-production-environment-secret-key-min-32-chars!
      ALLOWED_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost,http://127.0.0.1
      FRONTEND_URL: http://localhost:80
      DEMO_MODE: "true"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kisansetu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata_volume:
    driver: local
